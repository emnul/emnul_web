# Deploys staging as the Preview and records a deployment to the staging environment, which main's ruleset requires (ADR 0006).
# The type check, lint and unit tests run first, so a staging commit that fails any of them never deploys and main won't take it.
# Workers Builds Preview builds stay off so feature-branch pushes spend no build minutes.
name: Preview

on:
  push:
    branches: [staging]

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: true

jobs:
  preview:
    name: Preview
    runs-on: ubuntu-latest
    # Only the staging branch may deploy to this environment.
    environment: staging
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run lint
      - run: bun run test
      - run: bun run build
      - run: bunx wrangler preview --name staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
